<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting | Liu Qi</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F5F0;color:#333;font-family:Arial,sans-serif;text-align:center;padding:24px}a{color:#B22222;font-weight:700}
  </style>
</head>
<body>
  <div>
    <h1>Opening Liu Qi...</h1>
    <p>If the page does not open automatically, click below:</p>
    <p><a id="openLink" href="./personal-chinese-astrology-reading-v8/?v=final-cta">Open Final Landing Page</a></p>
  </div>
  <script>
    (function(){
      var max = 4;
      var n = parseInt(localStorage.getItem('liuqi_spots_left') || '', 10);
      var initialized = localStorage.getItem('liuqi_spots_initialized');
      if (!initialized || isNaN(n) || n < 0 || n > max) {
        n = Math.floor(Math.random() * max) + 1;
        localStorage.setItem('liuqi_spots_left', String(n));
        localStorage.setItem('liuqi_spots_initialized', '1');
      }
      window.location.replace('./personal-chinese-astrology-reading-v8/?v=final-cta');
    })();
  </script>
</body>
</html>
