<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>正在生成紫微流年命盘</title>
  <link rel="preload" as="image" href="assets/loading-bg.svg">
  <link rel="preload" as="image" href="assets/unlock-bg.svg">
  <link rel="preload" as="image" href="assets/unlock-btn.svg">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#160504}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}.page{width:100%;max-width:480px;min-height:100vh;margin:0 auto;position:relative;overflow:hidden;background:#260907}.panel{position:absolute;inset:0 auto auto 0;width:100%;transition:opacity .52s ease,visibility .52s ease}.panel img{width:100%;height:auto;display:block}.unlock{opacity:0;visibility:hidden}.done .loading{opacity:0;visibility:hidden}.done .unlock{opacity:1;visibility:visible}.info,.status,.progress,.unlock-btn{position:absolute;z-index:5}.info{left:36%;top:28.7%;width:38%;color:#68301c;font-size:clamp(12px,3.4vw,16px);line-height:1.58;font-weight:700}.status{left:0;right:0;top:70.6%;text-align:center;color:#8a5b20;font-size:clamp(15px,4.4vw,20px);font-weight:900;letter-spacing:.5px}.progress{left:15%;top:75.1%;width:70%;height:12px;border-radius:999px;overflow:hidden;background:rgba(255,244,198,.75);box-shadow:inset 0 1px 2px rgba(90,55,10,.25)}.fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ff8a45,#e63720,#b90e12);transition:width .45s ease}.unlock-btn{left:50%;top:75.5%;width:76%;transform:translateX(-50%);display:block;animation:btnFloat 1.65s ease-in-out infinite}.unlock-btn:active{animation:none;transform:translateX(-50%) scale(.96)}.unlock-btn img{width:100%;display:block;pointer-events:none}@keyframes btnFloat{0%,100%{transform:translateX(-50%) translateY(0) scale(1);filter:drop-shadow(0 0 8px rgba(255,80,30,.45))}50%{transform:translateX(-50%) translateY(-6px) scale(1.025);filter:drop-shadow(0 0 18px rgba(255,80,30,.85))}}.fade{animation:fadeIn .45s ease both}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  <main class="page" id="page">
    <section class="panel loading"><img src="assets/loading-bg.svg" alt="2026紫微流年命盘加载页"><div class="info"><div>姓名：<span id="n">明后</span></div><div>性别：<span id="g">男</span></div><div>出生：<span id="b">信息已录入</span></div></div><div class="status" id="status">1. 正在校验出生信息</div><div class="progress"><div class="fill" id="fill"></div></div></section>
    <section class="panel unlock"><img src="assets/unlock-bg.svg" alt="完整解析已生成"><a class="unlock-btn" id="unlockBtn" href="checkout.html" aria-label="立即解锁"><img src="assets/unlock-btn.svg" alt="立即解锁"></a></section>
  </main>
  <script>
    const qs=new URLSearchParams(location.search);let saved={};try{saved=JSON.parse(localStorage.getItem('fortuneUser')||'{}')}catch(e){};
    const name=qs.get('name')||saved.name||'明后',gender=qs.get('gender')||saved.gender||'男',birthday=qs.get('birthday')||saved.birthday||'信息已录入',birthTime=qs.get('birthTime')||saved.birthTime||'';
    document.getElementById('n').textContent=name;document.getElementById('g').textContent=gender;document.getElementById('b').textContent=birthday+(birthTime?' '+birthTime:'');
    const texts=['1. 正在校验出生信息','2. 正在生成紫微命盘','3. 正在推演流年宫位','4. 正在分析事业、财运、感情','5. 正在分析流年机遇、运势变化'];
    const widths=[12,28,46,68,86,100];let i=0;const status=document.getElementById('status'),fill=document.getElementById('fill'),page=document.getElementById('page'),unlock=document.getElementById('unlockBtn');
    const final='checkout.html'+(location.search||'');unlock.href=final;fill.style.width=widths[0]+'%';
    const timer=setInterval(()=>{i++;fill.style.width=widths[i]+'%';if(i<texts.length){status.textContent=texts[i]}else{clearInterval(timer);status.textContent='5. 流年命盘分析完成';setTimeout(()=>page.classList.add('done'),650)}},1450);
  </script>
</body>
</html>
