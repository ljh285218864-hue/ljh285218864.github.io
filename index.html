<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2026流年运势测算</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#f4e2a6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
    body{overflow-x:hidden}
    .page{width:100%;max-width:480px;margin:0 auto;background:#f4e2a6;min-height:100vh;padding-bottom:96px}
    .page img{display:block;width:100%;height:auto;border:0}
    .bar{position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(108,0,0,.92),rgba(108,0,0,0))}
    .btn{display:block;width:min(92%,430px);margin:0 auto;padding:16px 18px;border-radius:999px;background:linear-gradient(180deg,#e5281e 0%,#b90000 100%);color:#fff6cc;text-decoration:none;text-align:center;font-size:20px;line-height:1;font-weight:900;letter-spacing:1px;border:2px solid #ffd15b;box-shadow:0 8px 22px rgba(126,0,0,.42)}
    .btn:active{transform:scale(.98)}
  </style>
</head>
<body>
  <main class="page">
    <img src="./Untitled%20design.png" alt="2026流年运势测算">
  </main>
  <div class="bar">
    <a class="btn" href="#">立即开始测算</a>
  </div>
</body>
</html>
